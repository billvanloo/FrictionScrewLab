      { title: 'OpenStax College Physics 2e, 5.3 Elasticity: stress and strain', url: 'https://openstax.org/books/college-physics-2e/pages/5-3-elasticity-stress-and-strain' },
      { title: "Shigley's Mechanical Engineering Design, ch. 8, lecture slides", url: 'https://web.itu.edu.tr/~halit/Makel/Ch_8_slides_m.pdf' },
      { title: 'RoyMech, power screws', url: 'https://www.roymech.co.uk/Useful_Tables/Cams_Springs/Power_Screws_1.html' },
      { title: 'Engineers Edge, power screws', url: 'https://www.engineersedge.com/mechanics_machines/power_screws_design_13982.htm' },
      { title: 'MechSimulator, power screw', url: 'https://mechsimulator.com/tools/power-screw/' },
      { title: 'MechanixCalc, power screw calculator notes', url: 'https://www.mechanixcalc.com/powerscrew' },
      { title: 'ScienceDirect Topics, power screw', url: 'https://www.sciencedirect.com/topics/engineering/power-screw' },
    ],
  };

  const CHALLENGES = [
    { id: 'FS-M1', title: 'Mystery surface', brief: 'The friction values are hidden. Tilt the ramp until the block just starts to slide, then predict μs for this surface.', inputs: { rampMode: 'simulate', theta: 5, m: 1, muS: 0.42, muK: 0.35 }, hidden: ['muS', 'muK'], tolerance: { match: 2, close: 10 }, example: true },
    { id: 'FS-C1', title: 'Four starts, slippery thread', brief: 'Predict the torque to raise, the handle force, the efficiency and whether the thread locks, then turn the screw and let go.', inputs: { W: 2000, d: 20, p: 4, n: 4, form: 'square', mu: 0.05, muC: 0, dC: 0, R: 300, useOverride: false, useFmeas: false }, requirePrediction: true, example: true },
    { id: 'FS-C2', title: 'Held by the collar', brief: 'A double-thread jack with a thrust collar. Is the thread self-locking? Does the load hold when you let go?', inputs: { W: 6400, d: 32, p: 4, n: 2, form: 'square', mu: 0.08, muC: 0.08, dC: 40, R: 300, useOverride: false, useFmeas: false }, requirePrediction: true, example: true },
  ];

  /* ------------------------------------------------------------ the tool */
  let APP = null;
  APP = Shell.create({
    tool: 'Friction and Screw Lab', repo: 'FrictionScrewLab', slug: 'friction-screw-lab', version: VERSION, schemaVersion: 1,
    subtitle: 'Engineering education · Friction and power screws',
    defaultState: L.defaultState,
    modes: { label: 'Mode', options: [{ id: 'sandbox', label: 'Ramp + Screw' }, { id: 'challenge', label: 'Challenge' }], get: a => a.state.mode, set: (a, v) => { a.state.mode = v; } },
    challenges: {
      builtIn: CHALLENGES,
      apply(app, c) {
        for (const k in c.inputs) if (Object.prototype.hasOwnProperty.call(app.state, k)) app.state[k] = c.inputs[k];
        if ('mu' in c.inputs) { app.state.muFrom = null; app.state.linkRamp = false; }
        resetMoving();
      },
    },
    help: HELP,
    afterLoad(app) {
      const s = app.state;
      if (!L.FORMS[s.form]) s.form = 'square';
      if (s.rampMode !== 'measure') s.rampMode = 'simulate';
      if ([1, 2, 5, 10].indexOf(s.zoom) < 0) s.zoom = 1;
      resetMoving();
    },
    build(app) {
      deg = v => app.fmt(v) + '°';
      const I = app.el.inputs, F = L.FIELDS;
      const sec = html => { const d = document.createElement('div'); d.innerHTML = html; I.appendChild(d); return d; };
      const num = (parent, id, key, label, step, extra) => app.numField(parent, Object.assign({ id, key, label, step, get: a => a.state[key], set: (a, v) => { a.state[key] = v; } }, F[key], extra || {}));
      // Ramp
      const rp = sec('<div class="sec-h">Ramp</div>');
      app.selectField(rp, { id: 'fsRM', label: 'Mode', options: [['simulate', 'Simulate'], ['measure', 'Measure']], get: a => a.state.rampMode, set: (a, v) => { a.state.rampMode = v; } });
      num(rp, 'fsTh', 'theta', 'Angle θ', 0.1);
      num(rp, 'fsM', 'm', 'Mass m', 0.1);
      const sim = sec(''); sim.id = 'fsSim'; rp.appendChild(sim);
      num(sim, 'fsMuS', 'muS', 'Static μ<sub>s</sub>', 0.01);
      num(sim, 'fsMuK', 'muK', 'Kinetic μ<sub>k</sub>', 0.01);
      sim.insertAdjacentHTML('beforeend', '<div class="btnrow"><button class="btn" id="fsReset" type="button">Reset block</button></div>');
      const ms = sec(''); ms.id = 'fsMeas'; rp.appendChild(ms);
      angleField(app, ms, 'fsAS', 'anglesS', 'Slip angles, static (°)');
      angleField(app, ms, 'fsAK', 'anglesK', 'Steady-sliding angles, kinetic (°)');
      ms.insertAdjacentHTML('beforeend', '<p class="note">Up to 20 trials each, separated by commas or spaces.</p><div class="btnrow"><button class="btn" id="fsSend" type="button">Send μ to Screw →</button></div><p class="note" id="fsSendMsg"></p>');
      // Screw
      const sw = sec('<div class="sec-h">Screw</div>');
      num(sw, 'fsW', 'W', 'Load W', 100);
      num(sw, 'fsD', 'd', 'Major diameter d', 1, { check: (v, a) => L.pitchCheck(a.state.p, v) });
      num(sw, 'fsP', 'p', 'Pitch p', 0.5, { check: (v, a) => L.pitchCheck(v, a.state.d) });
      num(sw, 'fsN', 'n', 'Starts n', 1);
      app.selectField(sw, { id: 'fsForm', label: 'Thread form', options: Object.keys(L.FORMS).map(k => [k, L.FORMS[k].label]), get: a => a.state.form, set: (a, v) => { a.state.form = v; } });
      num(sw, 'fsMu', 'mu', 'Thread friction μ', 0.01, { set: (a, v) => { if (v !== a.state.mu) { a.state.muFrom = null; a.state.linkRamp = false; } a.state.mu = v; } });
      sw.insertAdjacentHTML('beforeend', '<p class="note fsfrom" id="fsMuFrom" hidden></p>');
      app.checkField(sw, { id: 'fsLink', label: 'Use Ramp result (kinetic mean)', get: a => a.state.linkRamp, set: (a, v) => { a.state.linkRamp = v; if (v && !linkMu(a)) { a.state.linkRamp = false; a.toast('Type steady-sliding angles on the Ramp (Measure mode) first.'); } } });
      num(sw, 'fsMuC', 'muC', 'Collar friction μ<sub>c</sub>', 0.01);
      num(sw, 'fsDC', 'dC', 'Collar diameter d<sub>c</sub>', 1);
      num(sw, 'fsR', 'R', 'Handle radius R', 10);
      app.checkField(sw, { id: 'fsOv', label: 'Use measured mean and root diameters', get: a => a.state.useOverride, set: (a, v) => { a.state.useOverride = v; } });
      const ov = sec(''); ov.id = 'fsOvBox'; sw.appendChild(ov);
      num(ov, 'fsDm', 'dm', 'Mean diameter d<sub>m</sub>', 0.1, { check: (v, a) => L.dmCheck(Object.assign({}, a.state, { dm: v })) });
      num(ov, 'fsDr', 'dr', 'Root diameter d<sub>r</sub>', 0.1, { check: (v, a) => L.drCheck(Object.assign({}, a.state, { dr: v })) });
      app.checkField(sw, { id: 'fsFm', label: 'I measured the handle force', get: a => a.state.useFmeas, set: (a, v) => { a.state.useFmeas = v; } });
      const fm = sec(''); fm.id = 'fsFmBox'; sw.appendChild(fm);
      num(fm, 'fsFmeas', 'Fmeas', 'Measured force F<sub>meas</sub>', 1);
      // Stage
      app.el.stage.innerHTML = '<div class="drawcard" id="fsDraw"></div>' +
        '<div class="ctlrow"><button class="btn primary" id="fsUp" type="button">▲ Raise (hold)</button><button class="btn" id="fsDown" type="button">▼ Lower (hold)</button>' +
        '<span class="spacer"></span><span class="lbl" id="fsZoomL">Thread zoom</span><span class="seg" role="group" aria-labelledby="fsZoomL">' + [1, 2, 5, 10].map(z => '<button type="button" data-zoom="' + z + '" aria-pressed="false">×' + z + '</button>').join('') + '</span></div>' +
        '<p class="cap">Hold Raise to turn the screw up, Lower to turn it down, and let go to release. Drag the handle at the top of the ramp to tilt it. The thread profile redraws for square, Acme and trapezoidal threads.</p>';
      $('fsReset').addEventListener('click', () => resetBlock(app));
      $('fsSend').addEventListener('click', () => {
        const v = L.rampMu(app.state);
        if (v === null) { $('fsSendMsg').textContent = 'Type at least one steady-sliding angle first.'; return; }
        if (v < 0.01 || v > 1) { $('fsSendMsg').textContent = 'The mean μ ' + app.fmt(v) + ' is outside the screw\'s range (0.01 to 1).'; return; }
        app.state.mu = v; app.state.muFrom = 'ramp';
        $('fsSendMsg').textContent = 'Sent μ = ' + app.fmt(v) + ' to the screw.';
        app.refreshFields(); app.changed();
        app.announce('Sent μ = ' + app.fmt(v) + ' to the screw.');
      });
      document.querySelectorAll('[data-zoom]').forEach(b => b.addEventListener('click', () => { app.state.zoom = +b.dataset.zoom; app.changed({ keepPrediction: true }); }));
      wireRamp(app);
      const stage = app.el.stage;
      const opts = dir => ({
        button: $(dir > 0 ? 'fsUp' : 'fsDown'), keys: [dir > 0 ? 'ArrowUp' : 'ArrowDown'], keyTarget: stage,
        enabled: () => canTurn(app),
        onStart: () => startTurn(app, dir),
        onEnd: () => letGo(app),
      });
      window.__fs = { up: Hold.bind(opts(1)), down: Hold.bind(opts(-1)), ui, rampClock, jackClock };
    },
    render(app) {
      const s = app.state;
      // Fields checked against each other: fixing one clears the other's message.
      app.fields.filter(x => ['fsD', 'fsP', 'fsDm', 'fsDr'].indexOf(x.o.id) >= 0).forEach(x => x.revalidate());
      SOL = app.hasInvalid() ? null : L.solve(s);
      $('fsSim').hidden = s.rampMode !== 'simulate';
      $('fsMeas').hidden = s.rampMode !== 'measure';
      $('fsOvBox').hidden = !s.useOverride;
      $('fsFmBox').hidden = !s.useFmeas;
      const from = $('fsMuFrom');
      from.hidden = s.muFrom !== 'ramp';
      from.textContent = s.muFrom === 'ramp' ? 'from Ramp measurements' : '';
      document.querySelectorAll('[data-zoom]').forEach(b => b.setAttribute('aria-pressed', +b.dataset.zoom === s.zoom ? 'true' : 'false'));
      if (SOL) updateBlock(app);
      // Keep keyboard focus on the drawing's controls across a redraw.
      const fid = document.activeElement && document.activeElement.closest && document.activeElement.closest('#fsDraw') ? document.activeElement.id : null;
      $('fsDraw').innerHTML = draw(app).svg;
      if (fid && $(fid)) $(fid).focus({ preventScroll: true });
      $('fsUp').disabled = !SOL; $('fsDown').disabled = !SOL;
      app.el.results.innerHTML = results(app);
      const f = v => app.fmt(v), fu = (v, u) => app.fmtU(v, u);
      app.setWorking(SOL ? L.working(SOL, s, f, fu, app.isHidden('muS')) : []);
      app.describe(SOL ? L.describe(SOL, s, fu, app.masked(), app.isHidden('muS')) : 'The drawing cannot update until the highlighted input is fixed.');
    },
    drawing: (app, opts) => draw(app, opts),
    predictTargets: app => SOL ? L.targets(SOL, app.state, app.isHidden('muS')) : [],
    inputsSnapshot: app => L.snapshot(app.state),
    report(app) {
      const s = app.state, fu = app.fmtU, hid = k => app.isHidden(k);
      const inputs = [
        ['Ramp mode', s.rampMode === 'simulate' ? 'Simulate' : 'Measure'], ['Angle θ', deg(s.theta)], ['Mass m', fu(s.m, 'kg')],
        ['Static μs', hid('muS') ? 'hidden in this challenge' : app.fmt(s.muS)], ['Kinetic μk', hid('muK') ? 'hidden in this challenge' : app.fmt(s.muK)],
        ['Load W', fu(s.W, 'N')], ['Major diameter d', fu(s.d, 'mm')], ['Pitch p', fu(s.p, 'mm')], ['Starts n', String(s.n)], ['Thread form', L.FORMS[s.form].label],
        ['Thread friction μ', app.fmt(s.mu) + (s.muFrom === 'ramp' ? ' (from Ramp measurements)' : '')], ['Collar μc, dc', app.fmt(s.muC) + ', ' + fu(s.dC, 'mm')], ['Handle radius R', fu(s.R, 'mm')],
      ];
      if (s.useOverride) inputs.push(['Measured dm, dr', fu(s.dm, 'mm') + ', ' + fu(s.dr, 'mm')]);
      if (s.useFmeas) inputs.push(['Measured handle force', fu(s.Fmeas, 'N')]);
      if (!SOL) return { inputs, outputs: [['Results', app.invalidReason()]] };
      const sc = SOL.screw, r = SOL.ramp, m = app.masked(), H = v => m ? 'hidden until checked' : v;
      const outputs = [
        ['Ramp: slides or holds', r.slides ? 'slides' : 'holds'], ['Ramp: μ = tan θ', H(app.fmt(r.muAtTheta))],
        ['Lead l, dm, dr', fu(sc.l * 1000, 'mm') + ', ' + fu(sc.dm * 1000, 'mm') + ', ' + fu(sc.dr * 1000, 'mm')],
        ['Lead angle λ', deg(sc.lambda / DEG)], ['Friction angle φ', H(deg(sc.phi / DEG))], ['μ′', app.fmt(sc.muPrime)],
        ['Torque to raise T_R (total)', sc.raiseDefined ? H(fu(sc.TR, 'N·m')) : 'cannot be turned'],
        ['Torque to lower T_L (total)', H(fu(sc.TL, 'N·m'))],
        ['Handle force F', sc.raiseDefined ? H(fu(sc.F, 'N')) : '—'], ['Ideal handle force', fu(sc.Fideal, 'N')],
        ['Efficiency e', sc.raiseDefined ? H(fu(sc.e * 100, '%')) : '—'],
        ['Self-locking (thread)', H(sc.selfLockThread ? 'yes' : 'no')], ['Holds with collar', H(sc.holdsWithCollar ? 'yes' : 'no')],
        ['σ at root', fu(sc.sigma / 1e6, 'MPa')], ['τ at root', sc.raiseDefined ? H(fu(sc.tau / 1e6, 'MPa')) : '—'],
      ];
      if (sc.back) outputs.push(['Back-calculated μ', sc.back.mu === null ? 'no fit: ' + sc.back.reason : app.fmt(sc.back.mu)], ['Measured efficiency', fu(sc.back.eMeas * 100, '%')]);
      const sections = [];
      const tbl = (m2, name) => m2.mus.length ? '<h3 class="wk-h">' + name + '</h3><table><tr class="hd"><th>Trial</th><th>Angle</th><th>μ = tan θ</th></tr>' + m2.angles.map((a, i) => '<tr><td>' + (i + 1) + '</td><td class="mono">' + esc(deg(a)) + '</td><td class="mono">' + esc(app.fmt(m2.mus[i])) + '</td></tr>').join('') +
        '<tr><th colspan="2">Mean (min to max, sample s)</th><td class="mono">' + esc(app.fmt(m2.stats.mean)) + ' (' + esc(app.fmt(m2.stats.min)) + ' to ' + esc(app.fmt(m2.stats.max)) + (m2.stats.sd === null ? '' : ', s = ' + esc(app.fmt(m2.stats.sd))) + ')</td></tr></table>' : '';
      const mt = tbl(SOL.measS, 'Slip angles (static μs)') + tbl(SOL.measK, 'Steady-sliding angles (kinetic μk)');
      if (mt) sections.push({ title: 'Ramp measurements', html: mt });
      return { inputs, outputs, sections };
    },
  });
})();
</script>
</body>
</html>
